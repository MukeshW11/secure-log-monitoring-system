# =========================================================
# LogSentinel - Application Configuration
# =========================================================

spring.application.name=LogSentinel

# --- H2 In-Memory Database ---
spring.datasource.url=jdbc:h2:mem:logsentinel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# --- H2 Console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080

# --- Alert Engine Configuration ---
# Number of ERROR/CRITICAL events that trigger an alert
alert.engine.error-threshold=5
# Time window in seconds for threshold evaluation
alert.engine.window-seconds=60
# Cooldown period (seconds) before re-alerting for the same source
alert.engine.cooldown-seconds=300

# --- Rate Limiting (requests per minute per source) ---
rate.limit.requests-per-minute=100

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=LogSentinel
info.app.version=1.0.0
info.app.description=Secure Log Monitoring and Alert System
